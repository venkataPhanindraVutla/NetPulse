name: NetPulse
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  NetPulse:
    path: .
targets:
  NetPulse:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - App
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/NetPulse.entitlements
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.netpulse.NetPulse
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: NetPulse
        product: NetPulseCore
